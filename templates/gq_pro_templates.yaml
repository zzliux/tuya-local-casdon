# 凯度 GQ Pro 蒸烤箱衍生实体（tuya_local 只给分钟级 DP，这里做秒级倒计时 + 预热判断）
- binary_sensor:
    - name: "GQ Pro 预热中"
      unique_id: gq_pro_preheating
      icon: mdi:heat-wave
      state: >
        {# 设备 DP109 上报预热状态，再与运行状态求交，避免取消后 109 残留造成误显示 #}
        {{ is_state('sensor.chu_fang_zheng_kao_xiang_gq_pro_peng_ren_zhuang_tai', 'cooking')
           and is_state('binary_sensor.chu_fang_zheng_kao_xiang_gq_pro_yu_re_zhong', 'on') }}

- trigger:
    - platform: time_pattern
      seconds: "/1"
  sensor:
    - name: "GQ Pro 剩余时间"
      unique_id: gq_pro_remaining_seconds
      icon: mdi:timer-sand
      device_class: duration
      unit_of_measurement: s
      state: >
        {% set st = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_peng_ren_zhuang_tai') %}
        {% set tgt = states('number.chu_fang_zheng_kao_xiang_gq_pro_she_ding_wen_du') | float(0) %}
        {% set cur = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_dang_qian_wen_du') | float(0) %}
        {% set rem = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_sheng_yu_shi_jian') | int(0) %}
        {% set start = this.attributes.get('phase_start') %}
        {% if st != 'cooking' %}
          0
        {% elif tgt > 0 and cur >= tgt - 1 and start not in (none, 'none', '') %}
          {{ [ rem * 60 - (now().timestamp() - start | float(0)) | int, 0 ] | max }}
        {% else %}
          {{ rem * 60 }}
        {% endif %}
      attributes:
        phase_start: >
          {% set st = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_peng_ren_zhuang_tai') %}
          {% set tgt = states('number.chu_fang_zheng_kao_xiang_gq_pro_she_ding_wen_du') | float(0) %}
          {% set cur = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_dang_qian_wen_du') | float(0) %}
          {% set old = this.attributes.get('phase_start') %}
          {% if st == 'cooking' and tgt > 0 and cur >= tgt - 1 %}
            {{ old if old not in (none, 'none', '') else now().timestamp() }}
          {% else %}
            none
          {% endif %}

- binary_sensor:
    - name: "GQ Pro 门"
      unique_id: gq_pro_door
      device_class: door
      icon: mdi:door
      state: >
        {% set raw = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_status_raw') | int(0) %}
        {{ (raw // 256) % 2 == 1 }}

- sensor:
    - name: "GQ Pro 预约开始时间"
      unique_id: gq_pro_reservation_start
      icon: mdi:clock-start
      state: >
        {% set end = states('time.chu_fang_zheng_kao_xiang_gq_pro_yu_yue_jie_shu_shi_jian_she_bei') %}
        {% set dur = states('time.chu_fang_zheng_kao_xiang_gq_pro_peng_ren_shi_chang') %}
        {% if end in ('unknown', 'unavailable', 'none', '00:00:00')
              or dur in ('unknown', 'unavailable', 'none') %}
          unknown
        {% else %}
          {% set e = end.split(':') | map('int') | list %}
          {% set d = dur.split(':') | map('int') | list %}
          {% set s = ((e[0] * 60 + e[1]) - (d[0] * 60 + d[1])) % 1440 %}
          {{ '%02d:%02d' % (s // 60, s % 60) }}
        {% endif %}
