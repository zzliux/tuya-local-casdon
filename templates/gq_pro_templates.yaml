# 仅保留需要触发器/属性的模板实体（秒级倒计时）
# 其余派生实体（门/预热中/预约开始时间/预约时段）已改为 UI 辅助元素，可挂到设备页
- trigger:
    - platform: time_pattern
      seconds: "/1"
  sensor:
    - name: "GQ Pro 剩余时间"
      unique_id: gq_pro_remaining_seconds
      icon: mdi:timer-sand
      device_class: duration
      unit_of_measurement: s
      state: >
        {% set st = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_peng_ren_zhuang_tai') %}
        {% set tgt = states('number.chu_fang_zheng_kao_xiang_gq_pro_she_ding_wen_du') | float(0) %}
        {% set cur = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_dang_qian_wen_du') | float(0) %}
        {% set rem = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_sheng_yu_shi_jian') | int(0) %}
        {% set start = this.attributes.get('phase_start') %}
        {% if st != 'cooking' %}
          0
        {% elif tgt > 0 and cur >= tgt - 1 and start not in (none, 'none', '') %}
          {{ [ rem * 60 - (now().timestamp() - start | float(0)) | int, 0 ] | max }}
        {% else %}
          {{ rem * 60 }}
        {% endif %}
      attributes:
        phase_start: >
          {% set st = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_peng_ren_zhuang_tai') %}
          {% set tgt = states('number.chu_fang_zheng_kao_xiang_gq_pro_she_ding_wen_du') | float(0) %}
          {% set cur = states('sensor.chu_fang_zheng_kao_xiang_gq_pro_dang_qian_wen_du') | float(0) %}
          {% set old = this.attributes.get('phase_start') %}
          {% if st == 'cooking' and tgt > 0 and cur >= tgt - 1 %}
            {{ old if old not in (none, 'none', '') else now().timestamp() }}
          {% else %}
            none
          {% endif %}
