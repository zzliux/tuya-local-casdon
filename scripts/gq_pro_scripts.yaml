gq_pro_cancel:
  alias: "蒸烤箱 取消烹饪"
  icon: mdi:stop
  mode: single
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.chu_fang_zheng_kao_xiang_gq_pro_qi_dong
    - delay: 1
    - action: switch.turn_off
      target:
        entity_id: switch.chu_fang_zheng_kao_xiang_gq_pro_dian_yuan
gq_pro_start_reservation:
  alias: "蒸烤箱 启动预约"
  icon: mdi:clock-start
  mode: single
  sequence:
    - variables:
        mode: "{{ states('select.chu_fang_zheng_kao_xiang_gq_pro_peng_ren_mo_shi') }}"
        target_time: "{{ states('input_datetime.gq_pro_yu_yue_jie_shu_shi_jian') }}"
    - condition: template
      value_template: >-
        {{ mode not in ('无', 'unknown', 'unavailable', 'none')
           and target_time not in ('unknown', 'unavailable', 'none') }}
    - action: script.gq_pro_cancel
    - delay: 2
    - action: switch.turn_on
      target:
        entity_id: switch.chu_fang_zheng_kao_xiang_gq_pro_dian_yuan
    - delay: 3
    - action: select.select_option
      target:
        entity_id: select.chu_fang_zheng_kao_xiang_gq_pro_peng_ren_mo_shi
      data:
        option: "无"
    - delay: 1
    - action: select.select_option
      target:
        entity_id: select.chu_fang_zheng_kao_xiang_gq_pro_peng_ren_mo_shi
      data:
        option: "{{ mode }}"
    - delay: 3
    - action: time.set_value
      target:
        entity_id: time.chu_fang_zheng_kao_xiang_gq_pro_yu_yue_jie_shu_shi_jian_she_bei
      data:
        time: "{{ target_time }}"
