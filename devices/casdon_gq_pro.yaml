name: Oven
products:
  - id: asgqmfnxo0lsiaa4
    manufacturer: Casdon
    model: GQ Pro

entities:
  # ---- 电源 ----
  - entity: switch
    name: 电源
    icon: "mdi:power"
    dps:
      - id: 1
        name: switch
        type: boolean

  # ---- 启动（按当前设置的模式/温度/时长）----
  - entity: switch
    name: 启动
    icon: "mdi:play-pause"
    dps:
      - id: 2
        name: switch
        type: boolean
        optional: true

  # ---- 温度 ----
  - entity: number
    name: 设定温度
    icon: "mdi:thermometer"
    mode: box
    dps:
      - id: 7
        name: value
        type: integer
        unit: C
        range:
          min: 0
          max: 500
        mapping:
          - step: 5

  - entity: sensor
    name: 当前温度
    class: temperature
    dps:
      - id: 8
        name: sensor
        type: integer
        unit: C
        class: measurement

  # ---- 炉灯 ----
  - entity: light
    name: 炉灯
    dps:
      - id: 103
        name: switch
        type: boolean

  # ---- 时长 / 预约 ----
  - entity: time
    name: 烹饪时长
    translation_key: cooking_time
    dps:
      - id: 10
        name: minute
        type: integer
        optional: true
        range:
          min: 0
          max: 1440

  - entity: time
    name: 预约结束时间
    translation_key: timer
    dps:
      - id: 9
        name: minute
        type: integer
        optional: true
        range:
          min: 0
          max: 1440

  - entity: sensor
    name: 剩余时间
    translation_key: time_remaining
    class: duration
    dps:
      - id: 11
        name: sensor
        type: integer
        optional: true
        unit: min
        class: measurement

  # ---- 状态 ----
  - entity: sensor
    name: 烹饪状态
    class: enum
    translation_key: cooking_status
    dps:
      - id: 102
        name: sensor
        type: string
        mapping:
          - dps_val: wait
            value: wait
          - dps_val: reservation
            value: reservation
          - dps_val: cooking
            value: cooking
          - dps_val: preheating
            value: preheating
          - dps_val: preheat_warming
            value: preheat_warming
          - dps_val: cancel
            value: cancel
          - dps_val: done
            value: done
          - dps_val: pause
            value: pause

  # ---- 模式（原始值）----
  - entity: sensor
    name: 烹饪模式（原始值）
    category: diagnostic
    dps:
      - id: 105
        name: sensor
        type: string
        optional: true

  # ---- 模式（可切换）----
  - entity: select
    name: 烹饪模式
    icon: "mdi:stove"
    dps:
      - id: 105
        name: option
        type: string
        mapping:
          - dps_val: "none"
            value: "无"
          - dps_val: "1"
            value: "纯蒸"
          - dps_val: "2"
            value: "高温蒸"
          - dps_val: "3"
            value: "上下烤"
          - dps_val: "4"
            value: "3D热风"
          - dps_val: "5"
            value: "顶部热风"
          - dps_val: "6"
            value: "风扇烤"
          - dps_val: "7"
            value: "底部热风"
          - dps_val: "8"
            value: "大面积烤"
          - dps_val: "9"
            value: "下烤"
          - dps_val: "10"
            value: "低湿嫩烤"
          - dps_val: "11"
            value: "中湿嫩烤"
          - dps_val: "12"
            value: "高湿嫩烤"
          - dps_val: "13"
            value: "空气炸"
          - dps_val: "14"
            value: "养生炖"
          - dps_val: "15"
            value: "解冻"
          - dps_val: "16"
            value: "速热"
          - dps_val: "17"
            value: "发酵"
          - dps_val: "19"
            value: "保温"
          - dps_val: "21"
            value: "杀菌"
          - dps_val: "22"
            value: "烘干"
          - dps_val: "23"
            value: "除垢"

  # ---- 模式（同名传感器，与 select 一致，方便仪表盘/自动化引用）----
  - entity: sensor
    name: 烹饪模式（名称）
    class: enum
    icon: "mdi:stove"
    dps:
      - id: 105
        name: sensor
        type: string
        optional: true
        mapping:
          - dps_val: "none"
            value: "无"
          - dps_val: "1"
            value: "纯蒸"
          - dps_val: "2"
            value: "高温蒸"
          - dps_val: "3"
            value: "上下烤"
          - dps_val: "4"
            value: "3D热风"
          - dps_val: "5"
            value: "顶部热风"
          - dps_val: "6"
            value: "风扇烤"
          - dps_val: "7"
            value: "底部热风"
          - dps_val: "8"
            value: "大面积烤"
          - dps_val: "9"
            value: "下烤"
          - dps_val: "10"
            value: "低湿嫩烤"
          - dps_val: "11"
            value: "中湿嫩烤"
          - dps_val: "12"
            value: "高湿嫩烤"
          - dps_val: "13"
            value: "空气炸"
          - dps_val: "14"
            value: "养生炖"
          - dps_val: "15"
            value: "解冻"
          - dps_val: "16"
            value: "速热"
          - dps_val: "17"
            value: "发酵"
          - dps_val: "19"
            value: "保温"
          - dps_val: "21"
            value: "杀菌"
          - dps_val: "22"
            value: "烘干"
          - dps_val: "23"
            value: "除垢"

  # ---- 故障 / 门 ----
  - entity: sensor
    name: Status raw
    category: diagnostic
    dps:
      - id: 13
        name: sensor
        type: bitfield
        optional: true

  - entity: binary_sensor
    category: diagnostic
    class: problem
    translation_key: problem
    dps:
      - id: 13
        type: bitfield
        name: sensor
        optional: true
        mapping:
          # bit8 (256) 是门开状态，不是故障，这里排除掉
          - dps_val: 0
            value: false
          - dps_val: 256
            value: false
          - value: true
